        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            overflow: hidden;
        }

        .container {
            width: 380px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
            transition: transform .3s ease;
        }

            .container:hover {
                transform: translateY(-5px);
            }

        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .search {
            display: flex;
            gap: 10px;
        }

            .search input {
                flex: 1;
                padding: 14px;
                border: none;
                outline: none;
                border-radius: 12px;
                font-size: 16px;
                transition: box-shadow .3s;
            }

                .search input:focus {
                    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
                }

            .search button {
                padding: 14px 18px;
                border: none;
                border-radius: 12px;
                cursor: pointer;
                background: #fff;
                font-size: 20px;
                transition: transform .3s, background .3s;
            }

                .search button:hover {
                    transform: scale(1.1);
                    background: #f1f1f1;
                }

        .loader {
            display: none;
            margin: 25px auto;
            border: 5px solid rgba(255, 255, 255, .3);
            border-top: 5px solid white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .weather {
            display: none;
            margin-top: 25px;
            text-align: center;
            color: white;
            animation: fade .4s;
        }

            .weather img {
                width: 120px;
                filter: drop-shadow(0 5px 10px rgba(0,0,0,.3));
            }

            .weather h1 {
                font-size: 55px;
                margin: 10px 0;
                font-weight: 700;
            }

            .weather h3 {
                font-weight: 500;
                margin-bottom: 20px;
                text-transform: capitalize;
            }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        .card {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            background: rgba(255, 255, 255, .18);
            transition: transform .3s, background .3s;
        }

            .card:hover {
                transform: translateY(-5px);
                background: rgba(255, 255, 255, .25);
            }

            .card h4 {
                font-size: 14px;
                font-weight: 500;
                color: #e0e0e0;
            }

            .card p {
                font-size: 22px;
                font-weight: 600;
                margin-top: 8px;
                color: #fff;
            }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #ff4d4d;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            font-weight: 500;
            animation: fade .4s;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

                width: 95%;

            }

                font-size: 45px;
            }

                width: 100px;
            }
        }
